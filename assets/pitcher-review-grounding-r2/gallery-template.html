<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>9ZONE · 투수 스프라이트 전체 모션 검수</title>
<style>
:root{color-scheme:dark;--bg:#071017;--panel:#101d27;--edge:#2a414d;--ink:#edf3f5;--muted:#a6b4bd;--gold:#f0ca78;--mint:#85dfc3}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#18313b,var(--bg) 62%);color:var(--ink);font:14px/1.45 system-ui,sans-serif}header{padding:16px clamp(12px,2.5vw,30px);border-bottom:1px solid var(--edge)}h1{margin:0;font-size:clamp(19px,2.3vw,28px)}header p{margin:4px 0 0;color:var(--muted)}.tag{color:var(--gold);font-weight:800}main{max-width:1700px;margin:auto;padding:14px clamp(10px,1.8vw,24px) 28px}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px;background:var(--panel);border:1px solid var(--edge);border-radius:10px;margin-bottom:12px}label{font-size:12px;color:var(--muted)}select,button{font:inherit;color:var(--ink);background:#142a35;border:1px solid #48616c;border-radius:6px;padding:7px 9px}button{cursor:pointer}button:hover,button.active{border-color:var(--mint);color:#b8f4e0}button.active{background:#1d443c}input{accent-color:#62c6a3}.spacer{flex:1}.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:12px}.panel{background:var(--panel);border:1px solid var(--edge);border-radius:10px;overflow:hidden}.viewbar{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-bottom:1px solid var(--edge)}.viewbar strong{font-size:15px}.viewbar span{color:var(--muted);font-size:12px}.screen{position:relative;width:100%;overflow:hidden;background:#07121c;isolation:isolate}.screen>img.plate{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}.pitcher{position:absolute;z-index:3;image-rendering:pixelated;object-fit:fill;pointer-events:none}.fx{position:absolute;z-index:2;pointer-events:none;image-rendering:pixelated;opacity:.38}.dust{z-index:4;opacity:.38}.ball{position:absolute;z-index:5;width:3px;height:3px;transform:translate(-50%,-50%);border-radius:50%;background:#fff8d9;box-shadow:0 0 2px #fff5c4}.sceneNote{position:absolute;z-index:8;left:10px;top:9px;padding:5px 8px;border:1px solid #fff4;border-radius:6px;background:#05101ad9;color:#f8e7c0;font-size:11px}.field-pin{position:absolute;z-index:6;pointer-events:none;border:1px dashed #91d8c7aa}.foot{position:absolute;z-index:1;width:22px;height:5px;border-radius:50%;background:#07101966;transform:translate(-50%,-50%)}.meter{display:flex;gap:6px;flex-wrap:wrap;padding:8px 10px;color:var(--muted);font-size:11px}.meter span{padding:3px 7px;border:1px solid var(--edge);border-radius:20px}.side{display:grid;gap:12px;align-content:start}.section{padding:11px}.section h2{margin:0 0 8px;font-size:14px}.poses{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.pose{min-width:0;background:#08131b;border:1px solid var(--edge);border-radius:6px;padding:3px;cursor:pointer}.pose.selected{border-color:var(--gold)}.pose img{display:block;width:100%;aspect-ratio:1;object-fit:contain;image-rendering:pixelated}.pose small{display:block;text-align:center;font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden}.skill{padding:10px;border-radius:8px;background:#0a151e;border:1px solid var(--edge)}.skill b{color:#f4d48c}.skill p{margin:5px 0;color:var(--muted);font-size:12px}.phases{display:flex;gap:5px}.phases button{flex:1;padding:5px 4px;font-size:11px}.disclaimer{color:var(--gold)!important}.small{color:var(--muted);font-size:11px}.notice{color:#ffd38d}.hidden{display:none!important}
@media(max-width:880px){.layout{grid-template-columns:1fr}.side{grid-template-columns:1fr 1fr}.side .skills{grid-column:1/-1}}
@media(max-width:570px){.side{grid-template-columns:1fr}.side .skills{grid-column:auto}.toolbar{gap:5px}select,button{padding:6px}}
@media(orientation:landscape) and (max-height:500px){header{display:none}main{padding:4px 8px}.toolbar{padding:4px 6px;gap:4px;margin-bottom:5px;font-size:11px}.toolbar label{font-size:10px}.toolbar select,.toolbar button{padding:3px 6px;font-size:11px}.layout{grid-template-columns:minmax(0,1fr) 230px;gap:6px}.side{grid-template-columns:1fr;gap:5px;max-height:calc(100vh - 90px);overflow:auto}.side .section{padding:5px}.section h2{font-size:11px;margin-bottom:4px}.poses{grid-template-columns:repeat(6,1fr);gap:2px}.pose{padding:1px}.pose small{font-size:7px}.screen{min-height:0}.viewbar{padding:4px 7px}.meter{display:none}.skill{padding:5px}.skill p{font-size:9px;margin:2px 0}.small{font-size:9px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body>
<header><h1>9ZONE · 투수 동작 검수 후보</h1><p><span class="tag">외부 아트 검수 후보</span> · 등록 전 원화 및 발 접점 검토 · 본게임 미적용.</p></header>
<main><div class="toolbar">
<label>투수 <select id="character"></select></label><label>화면 <select id="layout"><option value="desktop">PC · 1440×810</option><option value="phone">휴대폰 가로 · 844×390</option></select></label>
<button id="play">일시정지</button><button id="stepBack">이전 포즈</button><button id="stepNext">다음 포즈</button><label>속도 <select id="speed"><option>.25</option><option>.5</option><option selected>1</option><option>1.5</option></select>×</label>
<label>기준 <select id="comparison"><option value="after">수정 후보</option><option value="before">기존</option></select></label><label><input type="checkbox" id="groundGuide"> 접지 가이드</label><label><input type="checkbox" id="effects" checked> 효과</label><label><input type="checkbox" id="zoneToggle"> 기존 9존 위치</label><label><input type="checkbox" id="reduce"> 움직임 줄이기</label><label>투수 HP <select id="hp"><option value=".95">95%</option><option value=".5">50%</option><option value=".2">20%</option></select></label><label>기믹 단계 <select id="phase"><option value="steady">안정</option><option value="pressured">압박</option><option value="critical">위기</option></select></label>
<span class="spacer"></span><span id="status" class="small">로딩</span></div>
<div class="layout"><section class="panel"><div class="viewbar"><strong id="who">—</strong><span id="poseLabel">—</span></div><div class="screen" id="screen"><img class="plate" id="plate"><svg id="groundSvg" class="hidden" style="position:absolute;inset:0;width:100%;height:100%;z-index:7;pointer-events:none;overflow:visible"><polygon id="rubberOutline" fill="none" stroke="#ffe28b" stroke-width="2" vector-effect="non-scaling-stroke"/><g id="contactPoints"></g></svg><i class="foot" id="foot"></i><i class="field-pin hidden" id="zoneBounds"></i><img class="fx hidden" id="fx"><img class="fx dust hidden" id="dust"><img class="pitcher" id="pitcher"><i class="ball hidden" id="ball"></i><div class="sceneNote">실제 필드 캡처 · 투수 원화 검수 후보</div></div><div class="meter"><span id="mound">마운드 기준 —</span><span id="size">스프라이트 크기 —</span><span id="release">릴리스 —</span><span id="flight">투구 비행 300ms</span></div></section>
<aside class="side"><section class="panel section"><h2>12포즈 접점</h2><div class="poses" id="poses"></div><p class="small">프레임 보간 없이 각 원화가 지정 시간 동안 유지됩니다.</p></section><section class="panel section skills"><h2>공개 기믹</h2><div class="skill"><b id="skillName">—</b><p id="skillSummary">이 투수에게 등록된 고유 기믹 데이터가 없습니다.</p><p id="phaseSummary"></p><div class="phases"><button data-phase="steady">안정</button><button data-phase="pressured">압박</button><button data-phase="critical">위기</button></div></div><p class="small disclaimer">기믹 표시는 기존 공개 규칙의 설명이며 게임 수치나 판정을 실행하지 않습니다.</p></section><section class="panel section"><h2>확인 정보</h2><p class="small" id="metadata"></p><p class="small notice">정지 포즈 기반 모션 후보. 승인/게임 적용 전 별도 프리뷰.</p></section></aside></div></main>
<script>const DATA=__DATA__;__SCRIPT__</script></body></html>
