<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <radialGradient id="ts-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#09252c"/>
      <stop offset="70%" stop-color="#0a171d"/>
      <stop offset="100%" stop-color="#04090c"/>
    </radialGradient>
    <radialGradient id="ts-glow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#0284c7" stop-opacity="0.4"/>
      <stop offset="80%" stop-color="#0369a1" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bat-wood-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2b87a"/>
      <stop offset="50%" stop-color="#b48344"/>
      <stop offset="100%" stop-color="#694619"/>
    </linearGradient>
    <linearGradient id="bat-wood-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5d69e"/>
      <stop offset="50%" stop-color="#c89856"/>
      <stop offset="100%" stop-color="#7a5323"/>
    </linearGradient>
    <linearGradient id="grip-tape" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="cyan-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="40%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="256" height="256" fill="url(#ts-bg)"/>
  <circle cx="128" cy="128" r="116" fill="none" stroke="url(#cyan-metal)" stroke-width="2" opacity="0.4"/>
  <circle cx="128" cy="128" r="108" fill="none" stroke="url(#cyan-metal)" stroke-width="1" stroke-dasharray="6,6" opacity="0.5"/>

  <!-- Energy Pulse Aura -->
  <circle cx="128" cy="128" r="92" fill="url(#ts-glow)"/>

  <!-- Dual Stack Connection Lines -->
  <g stroke="#38bdf8" stroke-width="2" opacity="0.6" stroke-dasharray="4,4">
    <circle cx="128" cy="128" r="76" fill="none"/>
    <path d="M 60 128 L 196 128 M 128 60 L 128 196"/>
  </g>

  <!-- Crossed Bat 1 (Top-Left to Bottom-Right) -->
  <g transform="rotate(45, 128, 128)">
    <!-- Barrel -->
    <path d="M 120 20 L 136 20 L 134 160 L 122 160 Z" fill="url(#bat-wood-1)" stroke="#523410" stroke-width="2"/>
    <!-- Handle -->
    <path d="M 123 160 L 133 160 L 132 225 L 124 225 Z" fill="#2c1a08" stroke="#1c1105" stroke-width="1.5"/>
    <!-- Grip Wrap Strips -->
    <path d="M 123 166 L 133 172 M 123 178 L 133 184 M 123 190 L 133 196 M 123 202 L 133 208 M 123 214 L 133 220" stroke="url(#grip-tape)" stroke-width="2.5"/>
    <!-- Knob -->
    <ellipse cx="128" cy="228" rx="8" ry="4" fill="url(#bat-wood-1)" stroke="#523410" stroke-width="1.5"/>
  </g>

  <!-- Crossed Bat 2 (Top-Right to Bottom-Left) -->
  <g transform="rotate(-45, 128, 128)">
    <!-- Barrel -->
    <path d="M 120 20 L 136 20 L 134 160 L 122 160 Z" fill="url(#bat-wood-2)" stroke="#523410" stroke-width="2"/>
    <!-- Handle -->
    <path d="M 123 160 L 133 160 L 132 225 L 124 225 Z" fill="#2c1a08" stroke="#1c1105" stroke-width="1.5"/>
    <!-- Grip Wrap Strips -->
    <path d="M 123 166 L 133 172 M 123 178 L 133 184 M 123 190 L 133 196 M 123 202 L 133 208 M 123 214 L 133 220" stroke="url(#grip-tape)" stroke-width="2.5"/>
    <!-- Knob -->
    <ellipse cx="128" cy="228" rx="8" ry="4" fill="url(#bat-wood-2)" stroke="#523410" stroke-width="1.5"/>
  </g>

  <!-- Interlocking Stack Energy Ring (Center Cross) -->
  <circle cx="128" cy="128" r="32" fill="#041219" stroke="url(#cyan-metal)" stroke-width="3" filter="url(#cyan-glow)"/>
  <circle cx="128" cy="128" r="26" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Energy Glyphs ① -> ② -->
  <g transform="translate(128, 128)">
    <circle cx="-11" cy="0" r="8" fill="#0284c7" stroke="#e0f2fe" stroke-width="1.5"/>
    <text x="-11" y="4" font-family="-apple-system, sans-serif" font-weight="900" font-size="10" fill="#fff" text-anchor="middle">1</text>
    <path d="M -2 0 L 2 0" stroke="#38bdf8" stroke-width="2" stroke-dasharray="1,1"/>
    <circle cx="11" cy="0" r="8" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
    <text x="11" y="4" font-family="-apple-system, sans-serif" font-weight="900" font-size="10" fill="#0c2330" text-anchor="middle">2</text>
  </g>

  <!-- Relic Emblem Badge (2X) -->
  <g transform="translate(128, 206)">
    <rect x="-30" y="-12" width="60" height="24" rx="4" fill="#0c1d24" stroke="url(#cyan-metal)" stroke-width="1.5"/>
    <text x="0" y="5" font-family="-apple-system, sans-serif" font-weight="900" font-size="12" fill="#7dd3fc" text-anchor="middle" letter-spacing="1.5">2X</text>
  </g>

  <!-- Title Top Arch -->
  <text x="128" y="32" font-family="-apple-system, sans-serif" font-weight="800" font-size="9" fill="#7dd3fc" text-anchor="middle" letter-spacing="2" opacity="0.9">DOUBLE GRIP SYNERGY</text>
</svg>
