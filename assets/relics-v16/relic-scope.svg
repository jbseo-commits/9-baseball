<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <radialGradient id="sc-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141c24"/>
      <stop offset="70%" stop-color="#090f14"/>
      <stop offset="100%" stop-color="#020406"/>
    </radialGradient>
    <radialGradient id="lens-glow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.7"/>
      <stop offset="40%" stop-color="#0284c7" stop-opacity="0.35"/>
      <stop offset="80%" stop-color="#0369a1" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#075985" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#eab308"/>
      <stop offset="50%" stop-color="#ca8a04"/>
      <stop offset="75%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>
    <linearGradient id="leather-wrap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#573318"/>
      <stop offset="50%" stop-color="#3b1d0c"/>
      <stop offset="100%" stop-color="#241005"/>
    </linearGradient>
    <linearGradient id="lens-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="scope-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="256" height="256" fill="url(#sc-bg)"/>
  <circle cx="128" cy="128" r="116" fill="none" stroke="url(#brass-grad)" stroke-width="2" opacity="0.4"/>
  <circle cx="128" cy="128" r="108" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="6,6" opacity="0.5"/>

  <!-- Tactical Lens Glow -->
  <circle cx="128" cy="120" r="88" fill="url(#lens-glow)"/>

  <!-- Scope Construction (Diagonal Antique Telescope) -->
  <g transform="translate(128, 120) rotate(-32)">
    <!-- Eye Piece (Back) -->
    <rect x="-70" y="-10" width="18" height="20" rx="3" fill="url(#brass-grad)" stroke="#451a03" stroke-width="1.5"/>
    <rect x="-76" y="-7" width="6" height="14" rx="2" fill="#713f12"/>
    
    <!-- First Barrel Extension (Small Brass) -->
    <rect x="-52" y="-12" width="28" height="24" fill="url(#brass-grad)" stroke="#451a03" stroke-width="1.5"/>
    <line x1="-38" y1="-12" x2="-38" y2="12" stroke="#fef08a" stroke-width="2" opacity="0.6"/>

    <!-- Main Barrel Body (Leather Wrapped) -->
    <rect x="-24" y="-17" width="52" height="34" rx="4" fill="url(#leather-wrap)" stroke="url(#brass-grad)" stroke-width="2"/>
    <!-- Leather Cross-Stitches -->
    <line x1="-12" y1="-14" x2="-6" y2="14" stroke="#d97706" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="8" y1="-14" x2="14" y2="14" stroke="#d97706" stroke-width="1.5" stroke-dasharray="3,3"/>

    <!-- Objective Bell / Lens Ring (Front) -->
    <path d="M 28 -17 L 54 -24 L 54 24 L 28 17 Z" fill="url(#brass-grad)" stroke="#451a03" stroke-width="2"/>
    <rect x="54" y="-26" width="14" height="52" rx="4" fill="url(#brass-grad)" stroke="#713f12" stroke-width="2"/>

    <!-- Front Objective Glass Lens -->
    <ellipse cx="64" cy="0" rx="6" ry="24" fill="url(#lens-glass)" stroke="#bae6fd" stroke-width="1.5"/>
    <!-- Glass Glint Highlight -->
    <ellipse cx="62" cy="-8" rx="2" ry="8" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Concentric Targeting Reticle Rings overlay -->
  <g transform="translate(128, 120)">
    <circle cx="0" cy="0" r="54" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,4" opacity="0.6"/>
    <circle cx="0" cy="0" r="32" fill="none" stroke="#67e8f9" stroke-width="1" opacity="0.4"/>
    <line x1="-60" y1="0" x2="-38" y2="0" stroke="#38bdf8" stroke-width="2"/>
    <line x1="38" y1="0" x2="60" y2="0" stroke="#38bdf8" stroke-width="2"/>
    <line x1="0" y1="-60" x2="0" y2="-38" stroke="#38bdf8" stroke-width="2"/>
    <line x1="0" y1="38" x2="0" y2="60" stroke="#38bdf8" stroke-width="2"/>
  </g>

  <!-- Relic Emblem Badge (SCOPE) -->
  <g transform="translate(128, 206)">
    <rect x="-38" y="-12" width="76" height="24" rx="4" fill="#0c1824" stroke="url(#brass-grad)" stroke-width="1.5"/>
    <text x="0" y="5" font-family="-apple-system, sans-serif" font-weight="900" font-size="12" fill="#38bdf8" text-anchor="middle" letter-spacing="1.5">SCOPE</text>
  </g>

  <!-- Title Top Arch -->
  <text x="128" y="32" font-family="-apple-system, sans-serif" font-weight="800" font-size="9" fill="#bae6fd" text-anchor="middle" letter-spacing="2" opacity="0.9">VINTAGE TELESCOPE</text>
</svg>
