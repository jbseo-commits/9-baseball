<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <radialGradient id="ft-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2d0c11"/>
      <stop offset="70%" stop-color="#19070a"/>
      <stop offset="100%" stop-color="#080203"/>
    </radialGradient>
    <radialGradient id="ft-glow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#ff4757" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#ee5253" stop-opacity="0.4"/>
      <stop offset="80%" stop-color="#b33939" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#b33939" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tape-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b81"/>
      <stop offset="40%" stop-color="#ee5253"/>
      <stop offset="80%" stop-color="#b33939"/>
      <stop offset="100%" stop-color="#5f1818"/>
    </linearGradient>
    <linearGradient id="steel-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#d1d8e0"/>
      <stop offset="70%" stop-color="#778ca3"/>
      <stop offset="100%" stop-color="#4b6584"/>
    </linearGradient>
    <filter id="crimson-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="256" height="256" fill="url(#ft-bg)"/>
  <circle cx="128" cy="128" r="116" fill="none" stroke="url(#tape-red)" stroke-width="2" opacity="0.4"/>
  <circle cx="128" cy="128" r="108" fill="none" stroke="url(#steel-metal)" stroke-width="1" stroke-dasharray="4,8" opacity="0.5"/>

  <!-- Crimson Aura -->
  <circle cx="128" cy="128" r="92" fill="url(#ft-glow)"/>

  <!-- Serrated Circular Saw Blade Base / Cutter Ring -->
  <g transform="translate(128, 128)">
    <circle cx="0" cy="0" r="74" fill="none" stroke="url(#steel-metal)" stroke-width="3" opacity="0.85"/>
    <!-- 16 Serrated Teeth -->
    <path d="
      M 0 -76 L 6 -68 L 12 -75 L 18 -67 L 24 -73 L 30 -65 L 36 -71 L 41 -62
      L 48 -66 L 53 -56 L 60 -59 L 64 -49 L 70 -51 L 73 -40 L 77 -41 L 79 -30
      L 82 -30 L 83 -18 L 85 -17 L 84 -5 L 85 -4 L 83 8 L 83 9 L 79 21
      L 78 22 L 72 33 L 71 34 L 64 44 L 62 45 L 54 54 L 52 55 L 43 62
      L 41 63 L 31 69 L 29 70 L 18 74 L 16 75 L 5 77 L 3 77 L -8 77
      L -10 76 L -21 73 L -23 72 L -34 67 L -36 66 L -46 59 L -48 58 L -57 49
      L -59 48 L -66 38 L -67 37 L -73 26 L -74 25 L -78 13 L -79 12 L -81 0
      L -81 -2 L -80 -14 L -80 -16 L -76 -27 L -75 -29 L -70 -39 L -69 -41 L -62 -51
      L -60 -52 L -52 -60 L -50 -61 L -41 -68 L -39 -69 L -29 -74 L -27 -75 L -16 -77
      Z
    " fill="#1e272e" stroke="url(#steel-metal)" stroke-width="1.5"/>
  </g>

  <!-- Tape Spool (Outer Crimson Layer) -->
  <circle cx="128" cy="128" r="58" fill="url(#tape-red)" stroke="#2c0b0e" stroke-width="2" filter="url(#crimson-glow)"/>
  <!-- Tape Layer Ridges -->
  <circle cx="128" cy="128" r="54" fill="none" stroke="#ff7979" stroke-width="1.5" opacity="0.6"/>
  <circle cx="128" cy="128" r="50" fill="none" stroke="#b33939" stroke-width="1.5" opacity="0.8"/>
  <circle cx="128" cy="128" r="46" fill="none" stroke="#ff7979" stroke-width="1" opacity="0.5"/>
  <circle cx="128" cy="128" r="42" fill="none" stroke="#801a1a" stroke-width="1.5"/>

  <!-- Core Cardboard Ring -->
  <circle cx="128" cy="128" r="32" fill="#d2b48c" stroke="#8b5a2b" stroke-width="2"/>
  <circle cx="128" cy="128" r="28" fill="#140608" stroke="#5a3818" stroke-width="1.5"/>

  <!-- Battle Foul Sparks & Slash Vectors -->
  <path d="M 90 90 L 166 166 M 85 140 L 171 116" stroke="#fff" stroke-width="2" stroke-linecap="round" filter="url(#crimson-glow)"/>
  <!-- Unraveling Tape Strip -->
  <path d="M 174 100 C 195 85 210 110 230 95" fill="none" stroke="url(#tape-red)" stroke-width="12" stroke-linecap="square"/>
  <path d="M 174 100 C 195 85 210 110 230 95" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6"/>

  <!-- Relic Emblem Badge (CUT) -->
  <g transform="translate(128, 206)">
    <rect x="-30" y="-12" width="60" height="24" rx="4" fill="#1e0a0d" stroke="url(#steel-metal)" stroke-width="1.5"/>
    <text x="0" y="5" font-family="-apple-system, sans-serif" font-weight="900" font-size="12" fill="#ff6b81" text-anchor="middle" letter-spacing="1.5">CUT</text>
  </g>

  <!-- Title Top Arch -->
  <text x="128" y="32" font-family="-apple-system, sans-serif" font-weight="800" font-size="9" fill="#ff7979" text-anchor="middle" letter-spacing="2" opacity="0.9">SERRATED FOUL TAPE</text>
</svg>
