<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <radialGradient id="fp-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a1f0d"/>
      <stop offset="70%" stop-color="#141109"/>
      <stop offset="100%" stop-color="#080704"/>
    </radialGradient>
    <radialGradient id="fp-glow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#ffd77c" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#e5a93b" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#b37418" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#b37418" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2c2"/>
      <stop offset="30%" stop-color="#f6d288"/>
      <stop offset="60%" stop-color="#c99738"/>
      <stop offset="100%" stop-color="#7a5513"/>
    </linearGradient>
    <linearGradient id="reticle-neon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe699"/>
      <stop offset="100%" stop-color="#ff9900"/>
    </linearGradient>
    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="256" height="256" fill="url(#fp-bg)"/>
  <circle cx="128" cy="128" r="116" fill="none" stroke="url(#gold-metal)" stroke-width="2" opacity="0.4"/>
  <circle cx="128" cy="128" r="108" fill="none" stroke="url(#gold-metal)" stroke-width="1" stroke-dasharray="4,6" opacity="0.6"/>

  <!-- Ambient Glow -->
  <circle cx="128" cy="128" r="95" fill="url(#fp-glow)"/>

  <!-- 9-Zone Mini Crosshair Matrix -->
  <g opacity="0.35" stroke="#f6d288" stroke-width="1">
    <rect x="80" y="80" width="96" height="96" fill="none" stroke-width="1.5"/>
    <line x1="112" y1="80" x2="112" y2="176"/>
    <line x1="144" y1="80" x2="144" y2="176"/>
    <line x1="80" y1="112" x2="176" y2="112"/>
    <line x1="80" y1="144" x2="176" y2="144"/>
  </g>

  <!-- Mechanical Reticle Outer Ring -->
  <circle cx="128" cy="128" r="72" fill="none" stroke="url(#gold-metal)" stroke-width="4" filter="url(#glow-filter)"/>
  <circle cx="128" cy="128" r="62" fill="none" stroke="#ffd77c" stroke-width="1.5" stroke-dasharray="12,16"/>

  <!-- Precision Dials and Ticks -->
  <g stroke="url(#gold-metal)" stroke-width="2">
    <line x1="128" y1="36" x2="128" y2="52"/>
    <line x1="128" y1="204" x2="128" y2="220"/>
    <line x1="36" y1="128" x2="52" y2="128"/>
    <line x1="204" y1="128" x2="220" y2="128"/>
    <!-- Diagonal Hashmarks -->
    <line x1="63" y1="63" x2="74" y2="74"/>
    <line x1="193" y1="63" x2="182" y2="74"/>
    <line x1="63" y1="193" x2="74" y2="182"/>
    <line x1="193" y1="193" x2="182" y2="182"/>
  </g>

  <!-- Bullseye Center - Baseball Silhouette with Glowing Seams -->
  <circle cx="128" cy="128" r="28" fill="#f4ecd8" stroke="#bda069" stroke-width="2"/>
  <!-- Red Seams -->
  <path d="M 112 108 C 118 116 118 140 112 148" fill="none" stroke="#d63031" stroke-width="2.5" stroke-dasharray="3,2"/>
  <path d="M 144 108 C 138 116 138 140 144 148" fill="none" stroke="#d63031" stroke-width="2.5" stroke-dasharray="3,2"/>

  <!-- Golden Sniper Crosshair Center Indicator -->
  <circle cx="128" cy="128" r="7" fill="none" stroke="#ff3838" stroke-width="2.5"/>
  <circle cx="128" cy="128" r="2.5" fill="#ff3838"/>

  <!-- Relic Emblem Badge (1ST) -->
  <g transform="translate(128, 206)">
    <rect x="-30" y="-12" width="60" height="24" rx="4" fill="#1b1408" stroke="url(#gold-metal)" stroke-width="1.5"/>
    <text x="0" y="5" font-family="-apple-system, sans-serif" font-weight="900" font-size="12" fill="#ffd77c" text-anchor="middle" letter-spacing="1.5">1ST</text>
  </g>

  <!-- Title Top Arch -->
  <text x="128" y="32" font-family="-apple-system, sans-serif" font-weight="800" font-size="9" fill="#f6d288" text-anchor="middle" letter-spacing="2" opacity="0.9">FIRST PITCH TARGET</text>
</svg>
