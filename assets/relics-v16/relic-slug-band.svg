<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <radialGradient id="sb-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a0808"/>
      <stop offset="70%" stop-color="#140404"/>
      <stop offset="100%" stop-color="#050101"/>
    </radialGradient>
    <radialGradient id="fire-glow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#ff4400" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#ea580c" stop-opacity="0.4"/>
      <stop offset="80%" stop-color="#b91c1c" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#7f1d1d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="band-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="30%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <linearGradient id="fabric-crimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <linearGradient id="flame-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="40%" stop-color="#f97316"/>
      <stop offset="75%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="flame-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="256" height="256" fill="url(#sb-bg)"/>
  <circle cx="128" cy="128" r="116" fill="none" stroke="url(#band-gold)" stroke-width="2" opacity="0.4"/>
  <circle cx="128" cy="128" r="108" fill="none" stroke="#f87171" stroke-width="1" stroke-dasharray="6,6" opacity="0.5"/>

  <!-- Flame Energy Glow -->
  <circle cx="128" cy="126" r="92" fill="url(#fire-glow)"/>

  <!-- Rising Flame Aura in Background -->
  <g transform="translate(128, 115)" filter="url(#flame-glow)" opacity="0.85">
    <path d="M -40 20 Q -50 -30 -20 -60 Q -30 -20 -10 -40 Q 0 -80 15 -50 Q 25 -30 35 -65 Q 45 -20 30 20 Z" fill="url(#flame-grad)"/>
    <path d="M -25 20 Q -30 -15 -10 -35 Q 0 -55 10 -35 Q 20 -15 15 20 Z" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- Main Wristband Body (Tubular Elastic Terrycloth / Compression Sleeve) -->
  <g transform="translate(128, 126)">
    <!-- Band Outer Frame / Stitch Lines -->
    <rect x="-65" y="-36" width="130" height="72" rx="16" fill="url(#fabric-crimson)" stroke="url(#band-gold)" stroke-width="3"/>
    
    <!-- Compression Rib Texture Lines -->
    <line x1="-50" y1="-30" x2="-50" y2="30" stroke="#fca5a5" stroke-width="2" opacity="0.3"/>
    <line x1="-35" y1="-30" x2="-35" y2="30" stroke="#fca5a5" stroke-width="2" opacity="0.3"/>
    <line x1="-20" y1="-30" x2="-20" y2="30" stroke="#fca5a5" stroke-width="2" opacity="0.3"/>
    <line x1="20" y1="-30" x2="20" y2="30" stroke="#fca5a5" stroke-width="2" opacity="0.3"/>
    <line x1="35" y1="-30" x2="35" y2="30" stroke="#fca5a5" stroke-width="2" opacity="0.3"/>
    <line x1="50" y1="-30" x2="50" y2="30" stroke="#fca5a5" stroke-width="2" opacity="0.3"/>

    <!-- Center Embroidered Emblem Patch -->
    <rect x="-34" y="-24" width="68" height="48" rx="8" fill="#1e1b4b" stroke="#fbbf24" stroke-width="2"/>
    <rect x="-30" y="-20" width="60" height="40" rx="6" fill="#0f172a"/>

    <!-- Dual Lightning / Fire Impact Blades -->
    <path d="M -16 -12 L 8 -12 L -6 2 L 14 2 L -8 16 L 0 6 L -12 6 Z" fill="url(#flame-grad)"/>

    <!-- Golden Power Star Stitches -->
    <circle cx="-20" cy="0" r="2.5" fill="#fde047"/>
    <circle cx="20" cy="0" r="2.5" fill="#fde047"/>
  </g>

  <!-- Relic Emblem Badge (XBH) -->
  <g transform="translate(128, 206)">
    <rect x="-32" y="-12" width="64" height="24" rx="4" fill="#18181b" stroke="url(#band-gold)" stroke-width="1.5"/>
    <text x="0" y="5" font-family="-apple-system, sans-serif" font-weight="900" font-size="12" fill="#fb923c" text-anchor="middle" letter-spacing="1.5">XBH</text>
  </g>

  <!-- Title Top Arch -->
  <text x="128" y="32" font-family="-apple-system, sans-serif" font-weight="800" font-size="9" fill="#fca5a5" text-anchor="middle" letter-spacing="2" opacity="0.9">CLEANUP WRISTBAND</text>
</svg>
