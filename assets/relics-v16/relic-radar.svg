<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <radialGradient id="rd-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#062e24"/>
      <stop offset="70%" stop-color="#031712"/>
      <stop offset="100%" stop-color="#010806"/>
    </radialGradient>
    <radialGradient id="radar-glow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.75"/>
      <stop offset="40%" stop-color="#059669" stop-opacity="0.35"/>
      <stop offset="80%" stop-color="#047857" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gun-casing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gun-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="256" height="256" fill="url(#rd-bg)"/>
  <circle cx="128" cy="128" r="116" fill="none" stroke="url(#gun-gold)" stroke-width="2" opacity="0.4"/>
  <circle cx="128" cy="128" r="108" fill="none" stroke="#34d399" stroke-width="1" stroke-dasharray="6,6" opacity="0.5"/>

  <!-- Emerald Radar Field Glow -->
  <circle cx="128" cy="120" r="88" fill="url(#radar-glow)"/>

  <!-- Concentric Radar Microwave Pulse Waves -->
  <g transform="translate(128, 115)" stroke="#10b981" fill="none" opacity="0.6">
    <path d="M 30 -30 A 42 42 0 0 1 30 30" stroke-width="2" stroke-linecap="round"/>
    <path d="M 45 -45 A 64 64 0 0 1 45 45" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 60 -60 A 85 85 0 0 1 60 60" stroke-width="3" stroke-linecap="round" stroke-dasharray="8,6"/>
  </g>

  <!-- High-Tech Radar Gun Body -->
  <g transform="translate(115, 118)">
    <!-- Pistol Grip Handle -->
    <path d="M -22 15 L -35 55 L -10 58 L 2 15 Z" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <rect x="-32" y="24" width="22" height="6" rx="2" fill="#334155"/>
    <rect x="-30" y="34" width="22" height="6" rx="2" fill="#334155"/>
    <rect x="-28" y="44" width="22" height="6" rx="2" fill="#334155"/>

    <!-- Main Barrel / Radar Horn Body -->
    <path d="M -48 -24 L 28 -24 L 38 -32 L 44 20 L 28 12 L -48 12 Z" fill="url(#gun-casing)" stroke="#475569" stroke-width="2"/>

    <!-- Microwave Emitter Cone Ring (Front) -->
    <rect x="36" y="-30" width="8" height="48" rx="3" fill="#10b981" opacity="0.9"/>

    <!-- Hazard Orange / Neon Accent Stripes -->
    <polygon points="-44,-20 -38,-20 -42,-14 -48,-14" fill="#f59e0b"/>
    <polygon points="-36,-20 -30,-20 -34,-14 -40,-14" fill="#f59e0b"/>

    <!-- Rear Digital LED Display Screen -->
    <rect x="-42" y="-18" width="46" height="26" rx="4" fill="#022c22" stroke="#10b981" stroke-width="1.5"/>
    <!-- Segmented Digits: "102" and "MPH" -->
    <text x="-20" y="-1" font-family="'Courier New', monospace" font-weight="900" font-size="14" fill="#34d399" text-anchor="middle" filter="url(#neon-glow)">102</text>
    <text x="-20" y="6" font-family="'Courier New', monospace" font-weight="700" font-size="6" fill="#a7f3d0" text-anchor="middle" letter-spacing="1">MPH</text>

    <!-- Trigger -->
    <path d="M 0 16 Q -6 24 2 28" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Relic Emblem Badge (RADAR) -->
  <g transform="translate(128, 206)">
    <rect x="-40" y="-12" width="80" height="24" rx="4" fill="#022c22" stroke="url(#gun-gold)" stroke-width="1.5"/>
    <text x="0" y="5" font-family="-apple-system, sans-serif" font-weight="900" font-size="12" fill="#34d399" text-anchor="middle" letter-spacing="1.5">RADAR</text>
  </g>

  <!-- Title Top Arch -->
  <text x="128" y="32" font-family="-apple-system, sans-serif" font-weight="800" font-size="9" fill="#a7f3d0" text-anchor="middle" letter-spacing="2" opacity="0.9">TACTICAL VELO RADAR</text>
</svg>
