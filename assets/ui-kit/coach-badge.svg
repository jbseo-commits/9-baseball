<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <!-- 9ZONE HOMEBOUND Tactical Coach Badge (Pixel-art Cel-shaded) -->
  <!-- Outer Rim (Brass / Rivet styling) -->
  <circle cx="32" cy="32" r="31" fill="#07080d" stroke="#c8923a" stroke-width="2"/>
  <circle cx="32" cy="32" r="28" fill="#141a33" stroke="#ffc861" stroke-width="1" stroke-opacity="0.6"/>
  <!-- Navy Dugout Interior -->
  <circle cx="32" cy="32" r="27" fill="#0d1122"/>

  <!-- Coach Jacket Body -->
  <path d="M12 58 Q32 46 52 58 L56 64 L8 64 Z" fill="#141a33"/>
  <path d="M22 48 L32 54 L42 48 L44 56 L32 62 L20 56 Z" fill="#2a3152"/>
  <!-- Jacket Cream Collar -->
  <path d="M21 44 L28 53 L32 50 L28 41 Z" fill="#ece4cf"/>
  <path d="M43 44 L36 53 L32 50 L36 41 Z" fill="#b7b09e"/>

  <!-- Neck -->
  <rect x="28" y="38" width="8" height="9" fill="#d9aa7d"/>
  <rect x="29" y="41" width="6" height="6" fill="#b37e54"/>

  <!-- Head / Face -->
  <path d="M23 27 C23 20 41 20 41 27 L41 37 C41 42 23 42 23 37 Z" fill="#f0be92"/>
  <!-- Face Shadowing -->
  <path d="M23 32 L27 38 L32 40 L37 38 L41 32 L41 36 L32 42 L23 36 Z" fill="#d9aa7d"/>
  <rect x="26" y="33" width="12" height="2" fill="#c49266"/>

  <!-- Facial Features (Intense Analytical Gaze) -->
  <!-- Eyebrows (Slate / Grey) -->
  <rect x="25" y="27" width="5" height="1.5" fill="#7b84a6"/>
  <rect x="34" y="27" width="5" height="1.5" fill="#7b84a6"/>
  <!-- Eyes -->
  <rect x="26" y="29" width="3" height="1.5" fill="#07080d"/>
  <rect x="35" y="29" width="3" height="1.5" fill="#07080d"/>
  <!-- Nose bridge -->
  <rect x="31" y="29" width="2" height="4" fill="#c49266"/>
  <!-- Determined Mouth -->
  <rect x="29" y="36" width="6" height="1" fill="#07080d"/>

  <!-- Headset Microphone -->
  <path d="M22 28 L20 33 L26 38" fill="none" stroke="#07080d" stroke-width="2"/>
  <circle cx="27" cy="38" r="2.5" fill="#2a3152" stroke="#07080d" stroke-width="1"/>
  <!-- Headset Ear Piece -->
  <rect x="20" y="27" width="3" height="6" rx="1" fill="#2a3152" stroke="#07080d" stroke-width="1"/>

  <!-- Baseball Cap (Navy & Cream Brim) -->
  <path d="M22 23 C22 13 42 13 42 23 Z" fill="#141a33"/>
  <path d="M25 15 Q32 12 39 15" fill="none" stroke="#2a3152" stroke-width="2"/>
  <circle cx="32" cy="14" r="1.5" fill="#ffc861"/>
  <!-- Cap Brim (Cream with Highlight) -->
  <path d="M19 23 Q32 20 47 25 L45 28 Q32 23 18 25 Z" fill="#ece4cf" stroke="#07080d" stroke-width="1"/>
  <path d="M21 24 Q32 22 43 25" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.8"/>

  <!-- Side Hair (Salt & Pepper Grey) -->
  <rect x="22" y="25" width="2" height="4" fill="#7b84a6"/>
  <rect x="40" y="25" width="2" height="4" fill="#7b84a6"/>

  <!-- Highlight Glint on Brass Rim -->
  <path d="M10 20 A24 24 0 0 1 24 10" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
</svg>
