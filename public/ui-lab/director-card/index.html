<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>9 Baseball · 카드 조준판 UI 목업</title>
  <style>
    html{background:#091521;color:#f1ead9}
    body{margin:0;min-height:100svh;display:grid;place-items:center}
    html body #director-nine .dn-surround{padding:16px 8px}
    #director-nine .cursor-interaction{cursor:pointer}
    #director-nine button:disabled{cursor:default}
    #director-nine .dn-more-glyph{font-size:24px;line-height:1}
    @media(max-width:420px){body{display:block;min-height:0}html body #director-nine .dn-surround{padding:0}html body #director-nine .dn-game{border-radius:0;box-shadow:none}}
  </style>
</head>
<body>
<div id="director-nine">
  <div class="dn-surround">
    <main class="dn-game" aria-label="9 BASEBALL 카드 중심 전투 목업">
      <header class="dn-header">
        <div class="dn-brand"><b>9</b><span>BASEBALL<small>ROGUE LEAGUE</small></span></div>
        <span class="dn-chapter">1막<span> · 첫 승부</span></span>
        <button type="button" class="dn-information cursor-interaction" aria-label="전투 정보 열기"><span class="dn-more-glyph" aria-hidden="true">⋯</span></button>
      </header>
      <div class="dn-scoreline"><span class="dn-count"></span><span class="dn-energy"></span></div>
      <section class="dn-arena" aria-label="작전과 경기 장면">
        <div class="dn-live">
          <div class="dn-scenery"></div><div class="dn-live-shade"></div>
          <div class="dn-bat" aria-hidden="true"></div><div class="dn-pitch" aria-hidden="true"></div>
          <div class="dn-versus"><span data-batter></span><b>VS</b><span data-pitcher></span><div class="dn-bases" role="img" aria-label="루상 주자 없음"><i data-base="1"></i><i data-base="2"></i><i data-base="3"></i></div></div>
          <div class="dn-rival"><span data-rival></span><span><b data-hp></b><small data-hpmax></small></span><div class="dn-hp-track"><div></div></div></div>
          <div class="dn-mound" aria-hidden="true"></div><div class="dn-box" aria-hidden="true"></div><div class="dn-plate" aria-hidden="true"></div>
          <div class="dn-ball" aria-hidden="true"></div><div class="dn-impact" aria-hidden="true"></div>
        </div>
        <section class="dn-plan" aria-label="펼친 작전 카드">
          <header class="dn-plan-head"><span class="dn-cost"></span><div><small class="dn-type"></small><h2 class="dn-name"></h2></div><button type="button" class="dn-basic cursor-interaction">기본<br>타격</button></header>
          <div class="dn-plan-body">
            <div class="dn-art-column"><img class="dn-main-art" alt=""><span class="dn-art-caption">MAIN</span></div>
            <div class="dn-aim-column"><div class="dn-aim-label"><span>공 경향 ▪</span><span class="dn-read-level"></span></div><div class="dn-grid" role="group" aria-label="9개 조준 코스"></div><div class="dn-skill-explain" hidden></div><div class="dn-zone-axes"><span>몸쪽</span><span>바깥쪽</span></div></div>
            <div class="dn-support-column"><span>지원</span><div class="dn-supports"></div></div>
          </div>
          <div class="dn-selection" aria-live="polite"></div>
          <div class="dn-plan-foot"><span class="dn-effect"></span></div>
        </section>
        <section class="dn-result" aria-live="polite" hidden></section>
        <div class="dn-replay" hidden></div>
        <section class="dn-details" aria-label="전투 상세 정보" hidden><header><b>전투 정보</b><button type="button" class="dn-close cursor-interaction">경기로 돌아가기</button></header><div class="dn-detail-content"></div></section>
      </section>
      <section class="dn-hand-area" aria-label="현재 손패"><div class="dn-hand-heading"><span>HAND <b data-hand-count></b></span><span class="dn-hand-mode">카드를 골라 작전을 펼치세요</span><span data-deck-count></span></div><div class="dn-hand"></div></section>
      <footer class="dn-actions"><div class="dn-action-note" aria-live="polite"></div><div class="dn-action-buttons"><button type="button" class="dn-take cursor-interaction">지켜본다<small>다음 공 +1</small></button><button type="button" class="dn-execute cursor-interaction"><span>휘두른다</span><b>↗</b></button></div></footer>
      <div class="dn-drag-ghost" aria-hidden="true" hidden><img alt="" draggable="false"><span></span></div>
    </main>
  </div>
  <style>
    #director-nine{color-scheme:dark;--dn-night:#111e2c;--dn-deep:#0a1420;--dn-paper:#f1ead9;--dn-paper-shade:#e4dcc9;--dn-ink:#172638;--dn-soft:#a5b2bd;--dn-red:#ee7059;--dn-blue:#91c9d8;--dn-rule:#beb8a9;width:100%;font-family:'Noto Sans KR','Malgun Gothic',system-ui,sans-serif;color:var(--dn-paper);background:transparent}

    #director-nine .dn-brand{display:flex;align-items:center;gap:7px;margin-right:auto}.dn-brand b{font-family:Georgia,serif;font-style:italic;font-size:40px;font-weight:700;line-height:1}.dn-brand>span{font-size:13px;font-weight:800;letter-spacing:1.2px}.dn-brand small{display:block;font-size:9px;font-weight:500;letter-spacing:1.5px;margin-top:1px;color:var(--dn-soft)}

    #director-nine .dn-plan{position:absolute;top:104px;left:12px;right:12px;height:279px;border-radius:3px 12px 12px 12px;background:var(--dn-paper);color:var(--dn-ink);box-shadow:0 8px 16px #0003;transform-origin:50% 80%;transition:transform .4s,opacity .3s;overflow:hidden;z-index:6;background-image:repeating-linear-gradient(5deg,#c7b99309 0,#c7b99309 1px,transparent 1px,transparent 4px)}#director-nine .dn-plan:before{content:'';position:absolute;top:0;left:0;height:4px;width:100%;background:var(--dn-red)}
    #director-nine .dn-plan-head{height:56px;display:flex;align-items:center;gap:9px;padding:9px 12px 4px}#director-nine .dn-cost{width:33px;height:33px;border:1px solid #afa995;border-radius:50%;display:grid;place-items:center;font-size:17px;font-weight:800;flex-shrink:0}#director-nine .dn-type{font-size:9px;letter-spacing:1.5px;color:#776d5c;display:block;margin-bottom:0}#director-nine .dn-name{font-size:21px;line-height:1.1;margin:0;font-weight:800;letter-spacing:-1px}#director-nine .dn-card-serial{font:10px/1.05 Georgia,serif;margin-left:auto;text-align:right;color:#8c8373;letter-spacing:1px}
    #director-nine .dn-plan-body{padding:0 11px;display:grid;grid-template-columns:minmax(44px,1fr) minmax(162px,180px) 44px;gap:9px;height:198px;align-items:start}#director-nine .dn-art-column{position:relative;margin-top:15px;height:171px;overflow:hidden;border-radius:2px;background:#4d7192}#director-nine .dn-main-art{width:100%;height:100%;object-fit:cover;object-position:50% 15%;filter:saturate(.84)}#director-nine .dn-art-caption{position:absolute;bottom:0;left:0;right:0;padding:5px 2px;text-align:center;background:#152f44dd;color:#f6f1e5;font:9px Georgia,serif;letter-spacing:2px}
    #director-nine .dn-aim-label{font-size:10px;display:flex;justify-content:space-between;height:16px;align-items:center;color:#776e5e}#director-nine .dn-read-level{letter-spacing:1px;color:#286076}#director-nine .dn-grid{display:grid;grid-template-columns:repeat(3,1fr);aspect-ratio:1;gap:3px;position:relative}#director-nine .dn-zone{position:relative;min-width:0;padding:0;border:0;border-radius:3px;background:#dad5c6;color:var(--dn-ink);transition:background .16s,box-shadow .16s;overflow:hidden;min-height:50px}#director-nine .dn-zone .dn-zone-number{position:absolute;top:5px;left:6px;font-size:10px;color:#837a6a}#director-nine .dn-zone.covered{background:#91b7c4}#director-nine .dn-zone.covered .dn-zone-number{color:#335561}#director-nine .dn-zone.primary{box-shadow:inset 0 0 0 2px var(--dn-red)}#director-nine .dn-zone.primary:after{content:'';position:absolute;inset:17px;border:2px solid var(--dn-red);border-radius:50%}#director-nine .dn-zone.arm-preview{box-shadow:inset 0 0 0 2px #315972}#director-nine .dn-zone.aim-support .dn-stamp{position:absolute;top:4px;right:4px;background:var(--dn-ink);color:var(--dn-paper);width:16px;height:16px;line-height:16px;border-radius:50%;font-size:10px;z-index:3}#director-nine .dn-heat{position:absolute;bottom:6px;left:6px;right:6px;display:flex;justify-content:center;gap:3px}#director-nine .dn-heat i{width:5px;height:3px;background:currentColor;opacity:.65}#director-nine .dn-prob{position:absolute;bottom:5px;left:0;right:0;font-size:10px;text-align:center}#director-nine .dn-zone-axes{height:14px;display:flex;justify-content:space-between;align-items:center;font-size:9px;color:#776e5e}
    #director-nine .dn-support-column>span{display:block;height:16px;font-size:10px;color:#776e5e;text-align:center}#director-nine .dn-supports{display:flex;flex-direction:column;gap:4px}#director-nine .dn-support{height:56px;width:44px;padding:0;border:1px dashed #b0aa99;background:#e7e0ce;color:#8c8472;font-size:17px;position:relative;border-radius:3px;overflow:hidden}#director-nine .dn-support img{width:100%;height:100%;object-fit:cover;object-position:50% 15%}#director-nine .dn-support .dn-slot-no{position:absolute;right:2px;bottom:2px;width:16px;height:16px;border-radius:50%;background:var(--dn-ink);color:var(--dn-paper);font-size:10px;display:grid;place-items:center}#director-nine .dn-support.armed{border:2px solid var(--dn-red);background:#efb6a4;color:#81382b}

    #director-nine .dn-hand-area{height:161px;padding:0 12px;background:var(--dn-night);position:relative;z-index:7}#director-nine .dn-hand-heading{height:27px;display:flex;align-items:center;justify-content:space-between;font-size:9px;letter-spacing:1px;color:var(--dn-soft)}#director-nine .dn-hand-heading b{font-weight:500;color:var(--dn-paper)}#director-nine .dn-hand-mode{font-size:10px;letter-spacing:0;color:var(--dn-paper);opacity:.8}#director-nine .dn-hand{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;align-items:start;height:131px}#director-nine .dn-hand-card{background:var(--dn-paper);color:var(--dn-ink);border-radius:4px;position:relative;transition:transform .18s,opacity .18s;box-shadow:0 3px 7px #0004;overflow:hidden}#director-nine .dn-card-main{display:flex;flex-direction:column;align-items:stretch;gap:0;padding:0;width:100%;height:91px;position:relative;border:0;background:var(--dn-paper);color:var(--dn-ink)}#director-nine .dn-card-main img{width:100%;height:70px;object-fit:cover;object-position:50% 15%;filter:saturate(.78)}#director-nine .dn-card-main .dn-mini-cost{position:absolute;top:3px;left:3px;min-width:18px;height:18px;background:var(--dn-paper);color:var(--dn-ink);font-size:11px;font-weight:800;display:grid;place-items:center;border-radius:50%;box-shadow:0 1px 5px #001a}#director-nine .dn-card-main strong{font-size:11px;line-height:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;font-weight:700;letter-spacing:-.6px}#director-nine .dn-card-support{height:36px;width:100%;padding:0;border:0;border-top:1px solid #b7ac9690;background:var(--dn-paper-shade);color:#4b6070;font-size:10px;letter-spacing:-.4px}#director-nine .dn-card-prep{height:36px;display:flex;align-items:center;justify-content:center;color:#786c57;font-size:10px;border-top:1px solid #b7ac9690;background:var(--dn-paper-shade)}#director-nine .dn-hand-card.selected{transform:translateY(-3px);box-shadow:0 0 0 2px var(--dn-red),0 5px 10px #0
