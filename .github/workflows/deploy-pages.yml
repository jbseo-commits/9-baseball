name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - 'ag/**'
      - 'codex/**'
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production main
        uses: actions/checkout@v6
        with:
          ref: main
          path: production

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: production/pnpm-lock.yaml

      - name: Build production root from main
        working-directory: production
        run: |
          pnpm install --frozen-lockfile
          VITE_BASE=/9-baseball/ pnpm run build
          test -f dist/index.html

      - name: Check out preview branch
        if: github.ref_name != 'main'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          path: preview

      - name: Build isolated branch preview
        if: github.ref_name != 'main'
        id: preview
        shell: bash
        run: |
          SAFE_BRANCH="$(printf '%s' '${{ github.ref_name }}' | sed -E 's#[^A-Za-z0-9._-]+#-#g')"
          PREVIEW_BASE="/9-baseball/previews/${SAFE_BRANCH}/"
          echo "safe_branch=${SAFE_BRANCH}" >> "$GITHUB_OUTPUT"
          cd preview
          pnpm install --frozen-lockfile
          VITE_BASE="${PREVIEW_BASE}" pnpm run build
          test -f dist/index.html
          mkdir -p "../production/dist/previews/${SAFE_BRANCH}"
          cp -a dist/. "../production/dist/previews/${SAFE_BRANCH}/"

      - name: Write preview index
        if: github.ref_name != 'main'
        shell: bash
        run: |
          SAFE_BRANCH='${{ steps.preview.outputs.safe_branch }}'
          cat > production/dist/previews/index.html <<EOF
          <!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>9 Baseball Preview</title><body style="font-family:system-ui;background:#071018;color:#fff;padding:24px"><h1>9 Baseball branch preview</h1><p>Branch: <code>${{ github.ref_name }}</code></p><p><a style="color:#7dd3fc" href="./${SAFE_BRANCH}/">Play this branch</a></p><p><a style="color:#94a3b8" href="/9-baseball/">Production main</a></p></body>
          EOF

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: production/dist

  deploy:
    environment:
      name: ag-v15-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy production root plus isolated preview
        id: deployment
        uses: actions/deploy-pages@v4
