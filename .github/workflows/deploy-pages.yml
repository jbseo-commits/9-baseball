name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # main only. The old branch previews (/preview/ V9, /gm12/, /batter-v1/, /ag-v15/) were
      # removed on 2026-09-29: their branches stopped in mid-September (ag-v15 was fully merged),
      # players kept testing stale builds, and every deploy rebuilt all four.
      - name: Check out main
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          test -f dist/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    # the name is historical: this environment is the one allowed to publish Pages, so it stays
    environment:
      name: ag-v15-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Confirm MAIN batter stand-in deployment
        if: github.event_name == 'push' && contains(github.event.head_commit.message, 'verify main batter stand-in deployment marker')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/issues/22/comments \
            -f body='✅ MAIN BATTER STAND-IN DEPLOYED — https://jbseo-commits.github.io/9-baseball/ — unfinished batter character removed from production'
