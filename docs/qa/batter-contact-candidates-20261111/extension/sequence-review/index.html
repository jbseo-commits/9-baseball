<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>타격 연결 동작 검수</title><style>body{margin:0;padding:16px;background:#101d27;color:#e6edf1;font:16px system-ui}h1{font-size:20px;margin:0 0 8px}p{max-width:90ch;line-height:1.5}button,select,input{font:inherit}button,select{padding:9px;margin:4px;border:1px solid #728a9e;border-radius:5px;background:#203441;color:white}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #ffce68}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:6px;position:sticky;top:0;background:#101d27;z-index:2}input{width:min(500px,90vw)}.stage{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.cell{position:relative;aspect-ratio:1;background:#e8ece9;overflow:hidden}.cell img{width:100%;height:100%;display:block}.cell b{position:absolute;top:6px;left:6px;background:#101d27;color:white;padding:3px 8px;font-size:14px}figcaption{margin-top:5px}figure{margin:0;min-width:0}.note{color:#ffce68}a{color:#9cd6fa}@media(max-width:700px){.stage{grid-template-columns:1fr}.cell{max-width:480px}body{padding:10px}}</style><h1>타격 연결 동작 · 검수용 재생</h1><p class="note">본편 미적용 후보입니다. 실제 경기의 판정·효과·소리는 연결하지 않았습니다. 같은 전신 캔버스만 배율 정규화했으며, 배우나 발을 따로 이동하지 않았습니다.</p><div class="controls"><button id="play">재생</button><button id="restart">처음부터</button><label>배속 <select id="rate"><option>.25</option><option>.5</option><option>.75</option><option selected>1</option><option>1.5</option><option>2</option></select></label><label>배경 <select id="background"><option value="#e8ece9">밝게</option><option value="#152431">어둡게</option></select></label><label><input type="range" id="time" min="0" max="2100" step="1" value="0" aria-label="동작 시간"></label><output id="clock"></output></div><div class="stage"><figure><div class="cell"><img id="row0" alt="높은 공 타격 연결 동작"><b id="label0"></b></div><figcaption>높은 공 · PRE→접촉→POST</figcaption></figure><figure><div class="cell"><img id="row1" alt="가운데 공 타격 연결 동작"><b id="label1"></b></div><figcaption>가운데 공 · PRE→접촉→POST</figcaption></figure><figure><div class="cell"><img id="row2" alt="낮은 공 타격 연결 동작"><b id="label2"></b></div><figcaption>낮은 공 · PRE→접촉→POST</figcaption></figure></div><p>접촉 전 75ms, 접촉 70ms, 접촉 후 75ms를 출발점으로 비교합니다. 앞뒤 기존 그림과의 실제 연결 품질은 별도 검수 대상입니다. 발 검사 합격은 연속 모션 합격을 뜻하지 않습니다.</p><p><a href="source-mapping.json">원본·정규화 기록</a> · <a href="contact-bridges.png">검수용 PNG 시트</a> · <a href="contact-bridges.webp">게임용 인코딩 후보</a></p><script>
const phases=[['old-0.png',180,'준비'],['old-1.png',80,'로딩1'],['old-2.png',75,'로딩2'],['old-3.png',60,'스텝'],['old-4.png',55,'착지'],['row-R-phase-0.png',75,'접촉 직전'],['row-R-phase-1.png',70,'접촉'],['row-R-phase-2.png',75,'팔로스루 시작'],['old-10.png',100,'팔로스루'],['old-11.png',90,'복귀1'],['old-12.png',70,'복귀2'],['old-13.png',70,'복귀3'],['old-0.png',1000,'준비']];
let playing=false,last=0,elapsed=0,raf=null;const samples=[];const controls={play:document.querySelector('#play'),time:document.querySelector('#time'),rate:document.querySelector('#rate')};
function draw(ms){let total=0,selected=phases.at(-1);for(const p of phases){total+=p[1];if(ms<total){selected=p;break;}}for(let r=0;r<3;r++){const img=document.querySelector('#row'+r),file=selected[0].replace('R',r);if(img.dataset.file!==file){img.src=file;img.dataset.file=file;}document.querySelector('#label'+r).textContent=selected[2];}document.querySelector('#clock').textContent=Math.round(ms)+' ms';controls.time.value=ms;return selected[2];}
function tick(now){if(!playing)return;elapsed+=(now-last)*Number(controls.rate.value);last=now;if(elapsed>2100){elapsed=2100;playing=false;controls.play.textContent='재생';}const phase=draw(elapsed);samples.push({wall:now,elapsed,phase});if(playing)raf=requestAnimationFrame(tick);}
controls.play.onclick=()=>{playing=!playing;if(elapsed>=2100)elapsed=0;controls.play.textContent=playing?'일시정지':'재생';last=performance.now();if(playing)raf=requestAnimationFrame(tick);};document.querySelector('#restart').onclick=()=>{elapsed=0;last=performance.now();draw(elapsed);};controls.time.oninput=()=>{playing=false;controls.play.textContent='재생';elapsed=Number(controls.time.value);draw(elapsed);};document.querySelector('#background').onchange=e=>document.querySelectorAll('.cell').forEach(c=>c.style.background=e.target.value);
const files=[...new Set(phases.flatMap(p=>p[0].includes('R')?[0,1,2].map(r=>p[0].replace('R',r)):[p[0]]))];window.review={draw,samples,ready:Promise.all(files.map(file=>new Promise((resolve,reject)=>{const i=new Image;i.onload=resolve;i.onerror=reject;i.src=file;})))};draw(0);
</script></html>
