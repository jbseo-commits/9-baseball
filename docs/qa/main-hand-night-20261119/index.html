<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Main 손패 · 밤 경기장 독립 fixture · HELD</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;display:block;overflow:hidden}</style><iframe title="실제 main 타석 컴포넌트 검수" src="/?battleUi=vnext&battleFixture=prepare&battlePresentation=clean"></iframe><script type="module">

const files=['stadium-400x225.png','red-fox-set.png','batter-foreground.png'];

 const canvas=doc.createElement('canvas');canvas.dataset.nightStudy='held';canvas.setAttribute('aria-label','정지 밤 경기장 연구 · 카메라 정합 HELD');Object.assign(canvas.style,{position:'absolute',inset:'0',width:'100%',height:'100%',zIndex:'1',pointerEvents:'none',imageRendering:'pixelated'});scene.append(canvas);

 const update=()=>{const faces=[...doc.querySelectorAll('.bv-cell')].map(e=>e.querySelector('.bv-cell-face')?.textContent||'');const phase=doc.querySelector('.battle-vnext')?.dataset.phase;const plan=markerPlan(faces,phase);badge.hidden=!plan.visible||badge.dataset.clipped==='true';badge.dataset.certain=String(plan.certain);badge.dataset.zones=plan.zones.join(',');badge.setAttribute('aria-label',plan.certain?'공개 확정 코스 '+(plan.zones[0]+1):'공개 가능 범위 · 실제 목표 미확정');badge.replaceChildren();const grid=doc.createElement('div');Object.assign(grid.style,{display:'grid',gridTemplateColumns:'repeat(3,8px)',gap:'2px'});for(let i=0;i<9;i++){const cell=doc.createElement('i');const on=plan.zones.includes(i);Object.assign(cell.style,{width:'8px',height:'8px',boxSizing:'border-box',border:on?'1px solid #fff9e5':'1px solid #546276',background:on?'#ffe0a0':'#243344',position:'relative'});if(on){const dot=doc.createElement('b');Object.assign(dot.style,{position:'absolute',width:'2px',height:'2px',left:'2px',top:'2px',background:'#192230'});cell.append(dot)}grid.append(cell)}badge.append(grid);const mark=doc.createElement('span');mark.textContent=plan.certain?'•':'?';Object.assign(mark.style,{display:'block',textAlign:'center',font:'bold 11px/12px monospace',color:'#fff3d0'});badge.append(mark)};

</script></html>
