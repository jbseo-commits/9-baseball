<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Red Fox single pitch · studio diagnostic</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;display:block;overflow:hidden}#tools{position:fixed;z-index:20;left:8px;bottom:8px;background:#101827ef;color:#ffe6bb;padding:6px;font:11px system-ui;border:1px solid #c39d65;max-width:260px}button{background:#26374b;color:#fff0d1;border:1px solid #d4b477;padding:6px;margin:3px;cursor:pointer}button:focus-visible{outline:3px solid #68dedd}#status{display:block}@media(orientation:portrait){#tools{display:none}}</style><iframe allow="fullscreen 'none'" title="main 손패와 공개 의도 배지를 유지한 studio 진단" src="../main-hand-night-20261119/index.html"></iframe><aside id="tools">STUDIO 진단 · 투구 중 존 숨김 · 모션 HELD<br><button id="replay">투구 / 다시 보기</button><button id="reset">준비로 초기화</button><span id="status" role="status">자산 준비 중</span></aside><script type="module">
import {shotAt,POSES} from './shot.js';
const host=document.querySelector('iframe'),reduced=matchMedia('(prefers-reduced-motion: reduce)');
const load=src=>new Promise((resolve,reject)=>{const i=new Image;i.onload=()=>resolve(i);i.onerror=reject;i.src=src});
const sprites=await Promise.all(POSES.map(p=>load('./assets/'+p+'.png'))),bg=await load('../approved-art-camera-20261119/assets/stadium-400x225.png'),foreground=await load('../approved-art-camera-20261119/assets/batter-foreground.png');
let raf=0,start=0,time=0,doc,scene,canvas,ctx,badge,grid,phase='ready',mounted=false;
function cancel(){if(raf)cancelAnimationFrame(raf);raf=0}
function draw(){if(!mounted)return;const state=shotAt(time);canvas.width=scene.clientWidth;canvas.height=scene.clientHeight;ctx.imageSmoothingEnabled=false;const k=Math.max(canvas.width/400,canvas.height/225),x=(canvas.width-400*k)/2,y=(canvas.height-225*k)/2;ctx.setTransform(k,0,0,k,x,y);ctx.drawImage(bg,0,0);ctx.fillStyle='#663330';ctx.beginPath();[[174,170],[187,166],[218,166],[233,171],[217,176],[190,176]].forEach(([a,b],i)=>i?ctx.lineTo(a,b):ctx.moveTo(a,b));ctx.fill();ctx.drawImage(sprites[state.index],...state.origin);ctx.drawImage(foreground,0,111);if(state.ball){ctx.fillStyle='#19202d';ctx.fillRect(Math.round(state.ball.x-state.ball.r-1),Math.round(state.ball.y-state.ball.r-1),Math.ceil(state.ball.r*2+2),Math.ceil(state.ball.r*2+2));ctx.fillStyle='#fff2cc';ctx.fillRect(Math.round(state.ball.x-state.ball.r),Math.round(state.ball.y-state.ball.r),Math.ceil(state.ball.r*2),Math.ceil(state.ball.r*2));}
 const ready=phase==='ready'||state.preparing;doc.querySelector('.battle-vnext').inert=phase!=='ready';grid.style.visibility=ready?'':'hidden';badge.style.display=ready?'':'none';badge.style.left=Math.round(x+206*k-19)+'px';badge.style.top=Math.round(y+80*k-52)+'px';badge.dataset.clipped=String(y+80*k-52<0);if(y+80*k-52<0)badge.style.display='none';
 window.shotEvidence={...state,time,phase,rafActive:!!raf,scale:k,offset:[x,y],spriteCount:1,externalBalls:state.ball?1:0,sourceScale:1};document.querySelector('#status').textContent=phase==='ready'?'준비 · 공개 단서 표시':state.done?'RECOVER · 종료 / 자동 준비 복귀 없음':state.preparing?'새 투구 준비':'투구 · '+state.pose.toUpperCase();}
function reset(){cancel();phase='ready';time=0;draw()}
function tick(now){time=Math.min(2200,now-start);draw();if(time<2200)raf=requestAnimationFrame(tick);else{raf=0;phase='finished';draw()}}
function replay(){reset();if(reduced.matches){phase='finished';time=2200;draw();return}phase='playing';start=performance.now();raf=requestAnimationFrame(tick)}
window.seekShot=t=>{cancel();time=t;phase=t>=2200?'finished':'playing';draw()};window.resetShot=reset;window.replayShot=replay;document.querySelector('#replay').onclick=replay;document.querySelector('#reset').onclick=reset;
function mount(){const inner=host.contentDocument?.querySelector('iframe');doc=inner?.contentDocument;scene=doc?.querySelector('.bv-scene');badge=doc?.querySelector('[data-public-intent]');grid=doc?.querySelector('.bv-decision-area');if(!host.contentWindow.fixtureReady||!scene||!badge||!grid)return false;canvas=doc.createElement('canvas');canvas.dataset.studioShot='true';Object.assign(canvas.style,{position:'absolute',inset:0,width:'100%',height:'100%',zIndex:2,pointerEvents:'none',imageRendering:'pixelated'});scene.append(canvas);ctx=canvas.getContext('2d');doc.querySelectorAll('.bv-action-dock').forEach(el=>{el.inert=true;el.title='studio 진단: 실제 투구 실행은 비활성'});mounted=true;new ResizeObserver(()=>{reset()}).observe(scene);reset();window.shotReady=true;return true}
const wait=setInterval(()=>{if(mount())clearInterval(wait)},30);window.addEventListener('pagehide',()=>{cancel();clearInterval(wait)});reduced.addEventListener('change',()=>{cancel();if(phase==='playing'){phase='finished';time=2200;draw()}});
</script></html>
